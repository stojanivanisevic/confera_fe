<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Radio</title>
<style>
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:420px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; max-width:720px; }
  .page { display:flex; justify-content:center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'stack', role:'radiogroup', 'aria-label':'Membership'},
    h(U.Radio, {name:'m', label:'Basic Associate membership - 138 EUR'}),
    h(U.Radio, {name:'m', label:'Regular associate membership - 298 EUR'}),
    h(U.Radio, {name:'m', label:'Premium (full) associate membership - 698 EUR', defaultChecked:true})));
</script>
</body>
</html>
