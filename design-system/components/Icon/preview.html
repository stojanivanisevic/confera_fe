<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon</title>
<style>
  body { margin:0; padding:16px; background:var(--background); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; gap:20px; align-items:center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  var names = ['mail','alert-circle','check-circle-2','check','x','chevron-down','arrow-left','arrow-right','arrow-up-right','upload','info','search','eye','eye-off','calendar','chevron-up','chevron-left','chevron-right','chevrons-up-down','plus','trash','more','file','alert-triangle','menu','users','home','settings','inbox','send','refresh','filter','minus','download','copy','external-link','edit','globe','log-out','user','lock','clock','file-text','credit-card','link'];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'row'}, names.map(function(n){ return h(U.Icon, {key:n, name:n, size:24, title:n}); })));
</script>
</body>
</html>
