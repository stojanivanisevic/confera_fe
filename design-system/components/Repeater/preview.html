<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Repeater</title>
<style>
  html, body { min-height:100%; }
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; gap:16px; max-width:640px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; max-width:760px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  
  ReactDOM.createRoot(document.getElementById('root')).render(h(function D(){var s=React.useState([{name:'Marko Petrovic',email:'marko.petrovic@example.org'},{name:'',email:''}]); return h('div',{style:{maxWidth:'680px'}}, h(U.Repeater,{label:'Co-authors',items:s[0],onChange:s[1],max:3,min:1,addLabel:'Add co-author',message:'Up to three; each extra co-author costs 30 EUR.',renderRow:function(it,i,upd){return h(React.Fragment,null,h(U.TextField,{id:'r-n'+i,label:'Name and surname',value:it.name,onChange:function(e){upd({name:e.target.value});}}),h(U.TextField,{id:'r-e'+i,label:'Email',value:it.email,onChange:function(e){upd({email:e.target.value});}}));}})); }));
</script>
</body>
</html>
