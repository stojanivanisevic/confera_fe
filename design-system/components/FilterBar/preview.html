<!-- @dsCard group="Patterns" height=120 subtitle="Filters above a table" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FilterBar</title>
<style>
  html, body { min-height:100%; }
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; gap:16px; max-width:640px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; max-width:760px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  
  ReactDOM.createRoot(document.getElementById('root')).render(h(U.FilterBar,{onReset:function(){},actions:h(U.Button,{variant:'dark',icon:'filter'},'Apply')}, h(U.SearchField,{placeholder:'Name or email'}), h(U.Select,{id:'f1',label:'Role',placeholder:'All roles',defaultValue:'',options:['Admin','Reviewer']}), h(U.Select,{id:'f2',label:'Status',placeholder:'Any',defaultValue:'',options:['Verified','Unverified']})));
</script>
</body>
</html>
