<!-- @dsCard group="Layout" height=420 subtitle="The application form card" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FormCard</title>
<style>
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:420px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; max-width:720px; }
  .page { display:flex; justify-content:center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'page'},
    h(U.FormCard, {title:'Kindly complete all mandatory fields. *', actions:h(U.Button, null, 'Send application')},
      h(U.TextField, {id:'fc1', label:'First and Last Name', placeholder:'Write here your First and Last Name', required:true}),
      h(U.TextField, {id:'fc2', label:'Email', placeholder:'ex. name@example.test', required:true}),
      h(U.Textarea, {id:'fc3', className:'ud-span-all', label:'Area of scientific and professional interest', required:true, rows:2}))));
</script>
</body>
</html>
