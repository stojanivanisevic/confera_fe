<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PageHeader</title>
<style>
  html, body { min-height:100%; }
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; gap:16px; max-width:640px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; max-width:760px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  
  ReactDOM.createRoot(document.getElementById('root')).render(h(U.PageHeader,{title:'Email servers',description:'Each template sends through its server; the fallback takes over when one fails.',breadcrumbs:[{label:'Settings',href:'#'},{label:'Email servers'}],actions:h(React.Fragment,null,h(U.Button,{variant:'dark',icon:'refresh'},'Check all'),h(U.Button,{icon:'plus'},'Add server'))}));
</script>
</body>
</html>
