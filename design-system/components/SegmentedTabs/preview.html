<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedTabs</title>
<style>
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:420px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; max-width:720px; }
  .page { display:flex; justify-content:center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(function Demo(){
    var s = React.useState('ind'), l = React.useState('en');
    return h('div', {className:'stack'},
      // With content: tabs with a panel.
      h(U.SegmentedTabs, {label:'Applicant type', value:s[0], onChange:s[1], options:[
        {value:'ind', label:'Individuals', content:h('p', {style:{margin:0}}, 'Membership for one person.')},
        {value:'co', label:'Companies/Enterprises', content:h('p', {style:{margin:0}}, 'Membership for an institution.')}]}),
      // Without content: a choice between values (a radio group), e.g. the language of a form.
      h(U.SegmentedTabs, {label:'Language', value:l[0], onChange:l[1], options:[{value:'en',label:'English'},{value:'sr',label:'Srpski'}]}));
  }));
</script>
</body>
</html>
