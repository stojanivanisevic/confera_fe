<!-- @dsCard group="Forms" height=120 subtitle="Numbers with a unit" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NumberField</title>
<style>
  html, body { min-height:100%; }
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; gap:16px; max-width:640px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; max-width:760px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'grid'}, h(U.NumberField,{id:'n1',label:'Full paper fee',unit:'EUR',defaultValue:260,min:0}), h(U.NumberField,{id:'n2',label:'Extra pages',defaultValue:2,min:0,status:'error',message:'Maximum 10 pages over the limit'})));
</script>
</body>
</html>
