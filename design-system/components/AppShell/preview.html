<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AppShell</title>
<style>
  html, body { min-height:100%; }
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; gap:16px; max-width:640px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; max-width:760px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  
  ReactDOM.createRoot(document.getElementById('root')).render(h(U.AppShell,{product:'Confera',logo:h('img',{src:'/_blob/7610060075d4c96e900364e0ec54fffb',alt:'UdEkoM Balkans',width:32,height:32}),
    sidebar:h(U.SidebarNav,{value:'users',items:[{value:'home',label:'Overview',icon:'home'},{value:'subs',label:'Submissions',icon:'inbox',badge:41},{value:'users',label:'Users and roles',icon:'users'},{value:'mail',label:'Email servers',icon:'send'}]}),
    topbar:h(React.Fragment,null,h('div',{style:{flex:1,maxWidth:'360px'}},h(U.SearchField,{placeholder:'Search'})),h('span',{style:{marginLeft:'auto'}},h(U.Avatar,{name:'Nikolina Vrcelj',size:'sm'})))},
  h(U.PageHeader,{title:'Users',breadcrumbs:[{label:'Settings',href:'#'},{label:'Users'}],actions:h(U.Button,{icon:'plus'},'Invite user')}),
  h(U.Card,null,h('p',{style:{margin:0}},'Content area.'))));
</script>
</body>
</html>
