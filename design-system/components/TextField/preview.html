<!-- @dsCard group="Forms" height=300 subtitle="Default, filled with icon, error, success, disabled" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField</title>
<style>
  body { margin:0; padding:16px; background:var(--background); font-family:var(--font-sans); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
  .stack { display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:420px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; max-width:720px; }
  .page { display:flex; justify-content:center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var U = window.Udekom, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'grid'},
    h(U.TextField, {id:'tf1', label:'First and Last Name', placeholder:'Write here your First and Last Name', required:true}),
    h(U.TextField, {id:'tf2', label:'Email address', icon:'mail', defaultValue:'thisismyemail@email.com', message:'This is note message text'}),
    h(U.TextField, {id:'tf3', label:'Phone number', defaultValue:'+381 62', status:'error', message:'Enter a full phone number'}),
    h(U.TextField, {id:'tf4', label:'Workplace', defaultValue:'University of Belgrade', status:'success', message:'Looks good'}),
    h(U.TextField, {id:'tf5', label:'Occupation', defaultValue:'Text input', disabled:true})));
</script>
</body>
</html>
