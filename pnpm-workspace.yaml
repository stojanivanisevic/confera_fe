# pnpm settings of confera_fe (pnpm 11 reads its settings from this file).
# The supply-chain rules of ADR-01 live here; they are the same as in confera_be.

packages:
  - apps/*
  - packages/*

# Installs never change the lockfile. To change a dependency on purpose:
#   corepack pnpm install --no-frozen-lockfile
frozenLockfile: true

# A script never installs behind your back: stale node_modules stop it instead.
verifyDepsBeforeRun: error

# A dependency that does not support the Node version in use stops the install.
engineStrict: true

# Exact versions only (no ^ or ~) when a dependency is added.
savePrefix: ''

# A version must be public for 3 days before it may be installed (4320 minutes).
# Setting the value makes it strict: an install fails rather than fall back to a newer version.
minimumReleaseAge: 4320

# Sub-dependencies may only come from the registry (no git or tarball addresses).
blockExoticSubdeps: true

# Dependency build scripts run only for the packages named here with `true`.
# A dependency with a build script that is not listed stops the install.
strictDepBuilds: true
allowBuilds:
  # Would only re-check that the prebuilt native resolver is present (a dependency of the
  # lint tooling); the binding arrives as a normal optional package.
  unrs-resolver: false

# Peer ranges are checked, not ignored.
strictPeerDependencies: true

# The one deliberate peer exception (ADR-19 open point, risk R-04):
# openapi-typescript 7.13.0 declares typescript ^5.x. It was run under 6.0.3
# and 5.9.3 on the same contract and produced byte-identical output, and
# `pnpm api:check` regenerates the types on every check. See README, "API client".
peerDependencyRules:
  allowedVersions:
    'openapi-typescript>typescript': '6.0.3'
